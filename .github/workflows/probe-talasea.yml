# TEMPORARY: checks whether Talasea answers requests from GitHub's runners.
# Remove after reading the result.
name: Probe Talasea

on:
  push:
    paths: [".github/workflows/probe-talasea.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Runner location
        run: curl -s -m 10 https://ipinfo.io/json | grep -E '"(ip|country|region|org)"' || true
      - name: Request Talasea (3 attempts)
        run: |
          for i in 1 2 3; do
            echo "=== attempt $i"
            curl -sS -m 20 -o body.json \
              -H "Origin: https://mrghamari.github.io" \
              -D headers.txt \
              -w "HTTP %{http_code} · connect %{time_connect}s · total %{time_total}s\n" \
              https://api.talasea.ir/api/market/getGoldPrice || echo "curl failed (exit $?)"
            echo "--- headers"; cat headers.txt 2>/dev/null || true
            echo "--- body (first 300 bytes)"; head -c 300 body.json 2>/dev/null || true; echo
            sleep 5
          done
